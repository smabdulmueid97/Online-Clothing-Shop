<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Online-Clothing-Shop — a PHP and MySQL clothing shop">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#059669"/>
      <stop offset="1" stop-color="#064E3B"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D1FAE5"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <circle cx="1050" cy="60" r="90" fill="#FFFFFF" opacity="0.08"/>
  <circle cx="110" cy="300" r="70" fill="#FFFFFF" opacity="0.08"/>
  <circle cx="980" cy="300" r="40" fill="#FFFFFF" opacity="0.10"/>
  <text x="60" y="90" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="bold" fill="#FFFFFF">Online-Clothing-Shop</text>
  <text x="60" y="135" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#A7F3D0">Browse, add to cart, check out — with an admin panel.</text>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="60" y="170" width="110" height="54" rx="27" fill="#FFFFFF"/>
    <text x="115" y="205" font-size="22" font-weight="bold" fill="#065F46" text-anchor="middle">PHP</text>
    <rect x="190" y="170" width="140" height="54" rx="27" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <text x="260" y="205" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle">MySQL</text>
    <rect x="350" y="170" width="190" height="54" rx="27" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <text x="445" y="205" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Admin panel</text>
  </g>
  <g>
    <rect x="700" y="150" width="440" height="130" rx="16" fill="url(#card)"/>
    <text x="730" y="190" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#065F46">Shop flow</text>
    <text x="730" y="222" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#334155">Register / log in → cart → checkout → payment</text>
    <text x="730" y="254" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#64748B">Database ships as shop_php.sql — just import it.</text>
  </g>
  <text x="60" y="320" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#9ED8BE">Account • Cart • Checkout • Login • Register • Payment</text>
</svg>
